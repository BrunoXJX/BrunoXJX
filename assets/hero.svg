<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-label="Bruno Jesus — Co-Founder &amp; CSO da Flowix, Software Engineer, Embaixador EY Top 1 Portugal">
<title>Bruno Jesus — Co-Founder &amp; CSO da Flowix, Software Engineer, Embaixador EY Top 1 Portugal</title>
<style>
text{font-family:'Segoe UI','Helvetica Neue',Arial,system-ui,sans-serif}
.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}

.in{animation:rise 1s cubic-bezier(0.16,1,0.3,1) both;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
.role{opacity:0;animation:role 12.8s cubic-bezier(0.16,1,0.3,1) infinite}
.r0{animation-delay:0s}
@keyframes role{0%{opacity:0;transform:translateY(12px)}3.5%{opacity:1;transform:none}22%{opacity:1;transform:none}25%{opacity:0;transform:translateY(-12px)}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.r0{opacity:1!important}}
.flow{animation:dash 1.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-24}}
.ring{transform-box:fill-box;transform-origin:center;animation:ping 3.2s ease-out infinite}
@keyframes ping{0%{transform:scale(.8);opacity:.9}70%,100%{transform:scale(1.35);opacity:0}}
.orbit{transform-box:fill-box;transform-origin:center;animation:spin 26s linear infinite}
.orbit2{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.core{transform-box:fill-box;transform-origin:center;animation:breathe 3.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.07)}}
.star{animation:tw 4s ease-in-out infinite;opacity:.15}
@keyframes tw{50%{opacity:.85}}
.live{animation:live 2s ease-in-out infinite}
@keyframes live{50%{opacity:.25}}
.shine{animation:shine 6s linear infinite}
@keyframes shine{from{transform:translateX(-400px)}to{transform:translateX(1000px)}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}.pulse{display:none}}
</style>

