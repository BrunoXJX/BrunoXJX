<path fill="url(#fw)" d="M0 128 C 160 112, 320 144, 500 128 S 840 112, 1000 128 V200 H0 Z"><animate attributeName="d" dur="9s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1" values="M0 128 C 160 126, 320 134, 500 128 S 840 126, 1000 118 V200 H0 Z;M0 138 C 160 100, 320 152, 500 138 S 840 100, 1000 136 V200 H0 Z;M0 128 C 160 126, 320 134, 500 128 S 840 126, 1000 118 V200 H0 Z"/></path>
